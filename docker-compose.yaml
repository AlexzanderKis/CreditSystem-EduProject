services:

  # PostgreSQL
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=myDataBase123'
      - 'POSTGRES_USER=postgres123'
      - 'POSTGRES_PASSWORD=postgres123'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres123 -d myDataBase123" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    #    container_name: rabbitmq
    #    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP protocol port (app connections)
      - "15672:15672" # RabbitMQ Management Dashboard web UI
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Kafka в режиме KRaft
  Kafka:
    image: apache/kafka:latest
    container_name: Kafka
    ports:
      - "9092:9092"
    environment:
      #      #configuration from chatGPT 2
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  #      #configuration from chatGPT 1
  #      KAFKA_NODE_ID: 1
  #      KAFKA_PROCESS_ROLES: "broker,controller"
  #      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
  #      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
  #      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
  #      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  #      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
  #      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  #      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  #      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  #      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  #      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  # 1 service
  credit-application-service:
    build:
      context: .
      dockerfile: CreditApplicationService/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myDataBase123
      SPRING_DATASOURCE_USERNAME: postgres123
      SPRING_DATASOURCE_PASSWORD: postgres123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
      Kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  # 2 service
  credit-processing-service:
    build:
      context: .
      dockerfile: CreditProcessingService/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
    depends_on:
      Kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres-data:
  rabbitmq-data: